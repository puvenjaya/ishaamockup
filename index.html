<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISHAA | Paradise Legacy</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg: #FAF9F6; --gold: #B89655; --dark: #1A1A1A; --accent: #8A9A86;
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { background: var(--bg); color: var(--dark); font-family: 'Montserrat', sans-serif; margin: 0; line-height: 1.6; overflow-x: hidden; }

        /* --- NAVIGATION --- */
        header { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 8%; background: var(--bg); position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .logo-link { display: block; transition: var(--transition); }
        .brand-logo { height: 70px; width: auto; display: block; }

        nav ul { display: flex; list-style: none; gap: 35px; padding: 0; margin: 0; align-items: center; }
        nav a { text-decoration: none; color: var(--dark); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
        
        .cart-icon { cursor: pointer; position: relative; font-size: 18px; }
        .cart-count { 
            position: absolute; top: -10px; right: -10px; background: var(--gold); 
            color: white; font-size: 10px; padding: 2px 6px; border-radius: 50%; 
        }

        /* --- SLIDE-OUT CART --- */
        #cart-sidebar {
            position: fixed; top: 0; right: -400px; width: 400px; height: 100%;
            background: white; box-shadow: -10px 0 30px rgba(0,0,0,0.05);
            z-index: 2000; padding: 40px; transition: var(--transition);
            display: flex; flex-direction: column;
        }
        #cart-sidebar.open { right: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .close-cart { cursor: pointer; font-size: 20px; }
        .cart-items { flex-grow: 1; overflow-y: auto; }
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .cart-total { padding-top: 20px; border-top: 2px solid var(--dark); margin-top: 20px; }
        .btn-checkout { 
            background: var(--dark); color: white; width: 100%; padding: 15px; 
            text-transform: uppercase; letter-spacing: 2px; border: none; margin-top: 20px; cursor: pointer;
        }

        /* --- HERO & GRID --- */
        #hero { height: 70vh; display: flex; align-items: center; justify-content: center; position: relative; color: white; text-align: center; }
        .hero-bg img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
        .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.2); z-index: -1; }
        .hero-tagline { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 5vw, 4rem); font-style: italic; }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 60px; max-width: 1300px; margin: 0 auto; padding: 80px 8%; }
        .product-card { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .img-wrapper { width: 100%; aspect-ratio: 4/5; overflow: hidden; margin-bottom: 20px; }
        .product-card img { width: 100%; height: 100%; object-fit: cover; transition: 0.8s; }
        .product-card:hover img { transform: scale(1.05); }

        .btn-add { background: none; border: 1px solid var(--gold); color: var(--gold); padding: 12px 30px; cursor: pointer; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; margin-top: 20px; }
        .btn-add:hover { background: var(--gold); color: white; }

        @media (max-width: 768px) {
            header { padding: 20px 5%; }
            #cart-sidebar { width: 100%; right: -100%; }
        }
    </style>
</head>
<body>

    <header>
        <a href="#hero" class="logo-link"><img src="./logo.png" alt="ISHAA" class="brand-logo"></a>
        <nav>
            <ul>
                <li><a href="#collection">COLLECTION</a></li>
                <li class="cart-icon" onclick="toggleCart()">
                    👜 <span class="cart-count" id="cart-count">0</span>
                </li>
            </ul>
        </nav>
    </header>

    <div id="cart-sidebar">
        <div class="cart-header">
            <h2 style="font-family:'Playfair Display'; font-weight:400;">Your Bag</h2>
            <span class="close-cart" onclick="toggleCart()">✕</span>
        </div>
        <div class="cart-items" id="cart-items-list">
            </div>
        <div class="cart-total">
            <div style="display:flex; justify-content:space-between; font-weight:600;">
                <span>Total</span>
                <span id="cart-total-price">$0.00</span>
            </div>
            <button class="btn-checkout" onclick="alert('Checkout integration coming soon with Business Account setup.')">Secure Checkout</button>
        </div>
    </div>

    <section id="hero">
        <div class="hero-bg"><img src="./ishaa_hero_1778066107936.png"></div>
        <div class="hero-overlay"></div>
        <h2 class="hero-tagline">Where Elegance Meets Eternity</h2>
    </section>

    <section id="collection">
        <div class="grid-container">
            <div class="product-card">
                <div class="img-wrapper"><img src="./ishaa_featured_1_1778066125221.png"></div>
                <h3>Lotus Bloom Necklace</h3>
                <p>$320.00</p>
                <button class="btn-add" onclick="addToCart('Lotus Bloom Necklace', 320)">Add to Bag</button>
            </div>
            <div class="product-card">
                <div class="img-wrapper"><img src="./ishaa_featured_2_1778066143398.png"></div>
                <h3>Sage Rose Earrings</h3>
                <p>$180.00</p>
                <button class="btn-add" onclick="addToCart('Sage Rose Earrings', 180)">Add to Bag</button>
            </div>
            <div class="product-card">
                <div class="img-wrapper"><img src="./ishaa_featured_3_1778066158370.png"></div>
                <h3>Crescent Horizon Bracelet</h3>
                <p>$250.00</p>
                <button class="btn-add" onclick="addToCart('Crescent Horizon Bracelet', 250)">Add to Bag</button>
            </div>
        </div>
    </section>

    <script>
        let cart = [];
        let total = 0;

        function toggleCart() {
            document.getElementById('cart-sidebar').classList.toggle('open');
        }

        function addToCart(name, price) {
            cart.push({name, price});
            updateCartUI();
            if(!document.getElementById('cart-sidebar').classList.contains('open')) {
                toggleCart();
            }
        }

        function updateCartUI() {
            const list = document.getElementById('cart-items-list');
            list.innerHTML = '';
            total = 0;
            
            cart.forEach((item, index) => {
                total += item.price;
                list.innerHTML += `
                    <div class="cart-item">
                        <span>${item.name}</span>
                        <span>$${item.price}</span>
                    </div>
                `;
            });
            
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('cart-total-price').innerText = `$${total.toFixed(2)}`;
        }
    </script>
</body>
</html>
