            --accent: #8A9A86;  /* Tropical Sage */
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {

    position: sticky; 
    top: 0; 
    z-index: 1000;
}

    text-decoration: none;
    color: var(--dark);
    transition: var(--transition);
}

        /* --- HERO SECTION --- */
        #hero { 
            height: 75vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            position: relative; 
            color: white; 
            overflow: hidden;
            margin-bottom: 60px;
        }
        
        .hero-bg img { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; 
            z-index: -1; 
        }
        
        .hero-overlay { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.25); 
            z-index: -1; 
        }
        
        .hero-tagline { 
            font-family: 'Playfair Display', serif; 
            font-size: clamp(2rem, 5vw, 4rem); 
            font-weight: 400; 
            font-style: italic; 
            letter-spacing: 2px;
        }

        /* --- GRID & CARD ALIGNMENT (THE FIX) --- */
        .section-heading { 
            text-align: center; 
            padding: 60px 0 20px; 
        }
        
        .section-heading h2 { 
            font-family: 'Playfair Display', serif; 
            font-size: 2.2rem; 
            font-weight: 400; 
            letter-spacing: 3px; 
            text-transform: capitalize;
        }

            display: grid;

            padding: 40px 8%; 
            justify-items: center; /* Centers cards in the grid */
        }
