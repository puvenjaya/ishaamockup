<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISHAA | Paradise Legacy</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* --- BRAND DESIGN SYSTEM --- */
        :root { 
            --bg: #FAF9F6;      
            --gold: #B89655;    
            --dark: #1A1A1A;    
            --accent: #8A9A86;  
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body { 
            background: var(--bg); 
            color: var(--dark); 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; 
            line-height: 1.6; 
            -webkit-font-smoothing: antialiased;
        }

        /* --- NAVIGATION FIXED & CENTERED --- */
        header { 
            display: flex; 
            flex-direction: row; 
            justify-content: space-between; 
            align-items: center;
            padding: 20px 8%; 
            background: var(--bg);
            position: sticky; 
            top: 0; 
            z-index: 1000;
            border-bottom: 1px solid rgba(0,0,0,0.05); /* Added subtle line for depth */
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 22px;       /* Refined size */
            letter-spacing: 6px;   /* Clean luxury spacing */
            text-transform: uppercase;
            text-decoration: none;
            color: var(--dark);
            transition: var(--transition);
        }

        nav ul { 
            display: flex; 
            list-style: none; 
            gap: 35px; 
            padding: 0; 
            margin: 0; 
        }
        
        nav a { 
            text-decoration: none; 
            color: var(--dark); 
            font-weight: 300; 
            font-size: 10px;       /* Slightly smaller for high-end feel */
            letter-spacing: 2px; 
            text-transform: uppercase; 
            transition: var(--transition);
        }

        nav a:hover { color: var(--gold); }

        /* --- HERO SECTION --- */
        #hero { 
            height: 75vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            position: relative; 
            color: white; 
            overflow: hidden;
            margin-bottom: 60px;
        }
        
        .hero-bg img { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; 
            z-index: -1; 
        }
        
        .hero-overlay { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.25); 
            z-index: -1; 
        }
        
        .hero-tagline { 
            font-family: 'Playfair Display', serif; 
            font-size: clamp(2rem, 5vw, 4rem); 
            font-weight: 400; 
            font-style: italic; 
            letter-spacing: 2px;
        }

        /* --- GRID & CARD ALIGNMENT --- */
        .section-heading { 
            text-align: center; 
            padding: 60px 0 20px; 
        }
        
        .section-heading h2 { 
            font-family: 'Playfair Display', serif; 
            font-size: 2.2rem; 
            font-weight: 400; 
            letter-spacing: 3px; 
            text-transform: capitalize;
        }

        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 80px; 
            max-width: 1300px; 
            margin: 0 auto; 
            padding: 40px 8%; 
            justify-items: center; 
        }

        .product-card { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            text-align: center; 
        }

        /* --- STYLES CONTINUED... (You can add your button styles back here) --- */
    </style>
</head>
<body>

    <header>
        <a href="#hero" class="logo-text">ISHAA</a>
        <nav>
            <ul>
                <li><a href="#hero">LEGACY</a></li>
                <li><a href="#collection">COLLECTION</a></li>
                <li><a href="#paradise-club">PARADISE CLUB</a></li>
            </ul>
        </nav>
    </header>

    </body>
</html>
